name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python files
        run: python -m py_compile server.py tools/*.py

      - name: Run offline regression suite
        run: python tools/qa_50_tests.py

      - name: Check generated source index
        run: |
          python tools/generate_sources_doc.py
          git diff --exit-code -- docs/SOURCES.md

      - name: Check tracked publication surface
        run: python tools/check_publication.py
